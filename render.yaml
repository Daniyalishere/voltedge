# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" > "Blueprint" and point it at the repository.
services:
  - type: web
    name: voltedge-ev-charging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Returns 503 if the data disk is unmounted or unwritable, so a bad
    # deploy is caught instead of serving a broken app.
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard (marked sync:false so they are
      # never committed to the repo).
      - key: GMAIL_USER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      # Persist JSON data on the mounted disk below.
      - key: DATA_DIR
        value: /var/data
    # A disk is required, otherwise users.json is wiped on every deploy
    # because Render's container filesystem is ephemeral.
    disk:
      name: voltedge-data
      mountPath: /var/data
      sizeGB: 1
